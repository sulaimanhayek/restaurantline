; restaurantline PHP configuration.
; Tuned for local development — see docs/DEPLOYMENT.md for production values.

memory_limit = 512M
max_execution_time = 60

; Voice agent payloads are small; a generous body size only helps the
; post_call_audio webhook, which carries base64 MP3.
post_max_size = 32M
upload_max_filesize = 32M

; Fail loudly in development. The agent endpoints never leak these to callers —
; they are caught and reformatted — but you want them in the logs.
display_errors = Off
log_errors = On
error_reporting = E_ALL

date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
